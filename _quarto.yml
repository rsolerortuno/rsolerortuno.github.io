project:
  type: website

website:
  title: "Rafael Soler Ortuño"
  site-url: "https://rsolerortuno.github.io"
  description: "Computational biology, immuno-oncology, spatial and single-cell genomics, and explainable AI for drug discovery."
  favicon: assets/favicon.svg
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: blog.qmd
        text: Blog
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/rsolerortuno
        aria-label: GitHub
      - icon: rss
        href: blog.xml
        aria-label: RSS
  page-footer:
    left: "© 2026 Rafael Soler Ortuño"
    right: "Built with Quarto and GitHub Pages"
  search: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true

execute:
  freeze: auto
